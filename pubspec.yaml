name: offgrid_sos_mesh
description: OffGrid SOS Mesh
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.4.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.0
  permission_handler: ^11.3.0
  sqflite: ^2.4.2
  path_provider: ^2.10.0
  sensors_plus: ^5.0.0
  vibration: ^2.0.0
  torch_light: ^1.1.0
  encrypt: ^5.0.1
  crypto: ^3.1.0
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.2.5
  share_plus: ^10.0.0
  device_info_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
